<!doctype html><meta charset="utf-8"><title>Lefty ring — detailcontrole</title><style>body{background:#b4b4b4;font:16px sans-serif}canvas{background:#ddd;max-width:none}section{display:inline-block;vertical-align:top;margin:12px}p{max-width:600px}</style><h1>Lefty ringvinger — glad navy leer, wit logo — 3× detail</h1><p>Back 7 geselecteerd — dezelfde renderer als de configurator. De hele ringvinger heeft één neutrale kleurlaag; borduurwerk staat erboven.</p><main></main><script type="module">
import{loadGlove,GloveRenderer}from'./glove-engine.js';try{const b=await loadGlove({progressive:true});for(const view of ['back','pinky']){await b.views[view].load();const r=new GloveRenderer({...b.views.back,views:b.views});r.setView(view);r.setWeb(null);r.setWebMarked(false);r.setMaterials({});const d=r.DATA,c=document.createElement('canvas');c.width=d.w;c.height=d.h;const state=Object.fromEntries(d.zones.map(z=>[z.id,['back7','back78'].includes(z.id)?'70':'10']));r.draw(c.getContext('2d'),state,0,{id:view==='back'?'back78':'back7',amount:.18},false,true);const box=d.embParts.reduce((a,v)=>[Math.min(a[0],v[0]),Math.min(a[1],v[1]),Math.max(a[2],v[2]),Math.max(a[3],v[3])],[Infinity,Infinity,0,0]);const x=d.w-box[2]-18,y=box[1]-18,w=box[2]-box[0]+36,h=box[3]-box[1]+36;const crop=document.createElement('canvas');crop.width=w*3;crop.height=h*3;crop.getContext('2d').drawImage(c,x,y,w,h,0,0,w*3,h*3);const s=document.createElement('section');s.append(view,crop);document.querySelector('main').append(s);}document.body.dataset.ready='true';}catch(e){document.body.append('FOUT '+e.message);console.error(e);}
</script>
