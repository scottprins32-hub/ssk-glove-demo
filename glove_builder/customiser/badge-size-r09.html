<!doctype html><meta charset="utf-8"><title>SSK logo size comparison</title><style>body{background:#eeeae5;font:16px system-ui;margin:30px}section{display:flex;gap:20px}figure{margin:0;text-align:center}canvas{background:#faf9f6;border:1px solid #ccc;max-width:28vw}h1{font-size:22px}</style><h1>Same logo width · original HD proportions</h1><section></section><script type="module">import {GloveRenderer} from './glove-engine.js'; const d=await(await fetch('./assets/glove-data.json')).json(); for(const i of [0,15,16]){const o=d.bullets[i],imgs={};for(const key of ['bullet_logo',o.asset]){const im=new Image;im.src=d.assets[key];await im.decode();imgs[key]=im}const f=document.createElement('figure'),c=document.createElement('canvas');c.width=320;c.height=210;const g=c.getContext('2d');g.translate(160-(d.bulletBox[0]+d.bulletBox[2])/2,105-(d.bulletBox[1]+d.bulletBox[3])/2);GloveRenderer.prototype.drawBullet.call({DATA:d,imgs},g,i);f.append(c);const t=document.createElement('p');t.textContent=o.name;f.append(t);document.querySelector('section').append(f)}</script>
