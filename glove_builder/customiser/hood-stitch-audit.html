<!doctype html><meta charset="utf-8"><title>Finger hood — dubbele stiklijnen</title><style>body{background:#aaa;font:16px sans-serif}section{display:inline-block;vertical-align:top;margin:12px}canvas{display:block;background:#aaa}</style><h1>Finger hood — dubbele open stiklijnen</h1><main></main><script type="module">
import{loadGlove,GloveRenderer}from'./glove-engine.js';try{const b=await loadGlove({progressive:true});for(const mirror of [false,true])for(const colour of ['20','70']){const r=new GloveRenderer({...b.views.back,views:b.views});r.setWeb(null);r.setWebMarked(false);r.setPad('hood','#F2F0EA');const d=r.DATA,c=document.createElement('canvas');c.width=d.w;c.height=d.h;const state=Object.fromEntries(d.zones.map(z=>[z.id,z.id==='stitching'?colour:'10']));r.draw(c.getContext('2d'),state,0,null,false,mirror);const crop=document.createElement('canvas');crop.width=340;crop.height=840;crop.getContext('2d').drawImage(c,mirror?d.w-580:410,415,170,420,0,0,340,840);const section=document.createElement('section');section.append((mirror?'LHT':'RHT')+' · Stiksel '+colour,crop);document.querySelector('main').append(section);}document.body.dataset.ready='true';}catch(e){document.body.append('FOUT '+e.message);console.error(e);}
</script>
