<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSK Custom Glove Builder</title>
<style>
  :root { --bg:#101216; --card:#1a1e26; --line:#2a3040; --tx:#e8e9ec;
          --mut:#9aa2b1; --acc:#f05a28; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx);
         font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { display:flex; align-items:baseline; gap:14px;
           padding:14px 22px; border-bottom:1px solid var(--line); }
  header h1 { font-size:19px; letter-spacing:.4px; }
  header .sub { color:var(--mut); font-size:13px; }
  .wrap { display:flex; gap:18px; padding:18px 22px; flex-wrap:wrap;
          align-items:flex-start; }
  .stage { flex:1 1 460px; min-width:340px; background:var(--card);
           border:1px solid var(--line); border-radius:12px; padding:14px;
           display:flex; align-items:center; justify-content:center; }
  #glove { max-width:100%; height:auto; cursor:pointer; border-radius:6px;
           max-height:calc(100vh - 130px); }
  .side { flex:1 1 380px; min-width:320px; display:flex;
          flex-direction:column; gap:14px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px;
             color:var(--mut); margin-bottom:10px; }
  .zones { display:flex; flex-wrap:wrap; gap:6px; }
  .zone { padding:5px 10px; border:1px solid var(--line); border-radius:99px;
          background:#141821; font-size:13px; cursor:pointer; display:flex;
          align-items:center; gap:7px; }
  .zone .dot { width:12px; height:12px; border-radius:3px;
               border:1px solid #0008; }
  .zone.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
  .colors { display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr));
            gap:6px; }
  .sw { display:flex; align-items:center; gap:7px; padding:5px 7px;
        border:1px solid var(--line); border-radius:8px; cursor:pointer;
        font-size:12px; background:#141821; }
  .sw:hover { border-color:#4a5468; }
  .sw.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
  .sw .chip { width:20px; height:20px; border-radius:5px; flex:none;
              border:1px solid #0009; }
  .sw.off { opacity:.35; pointer-events:none; }
  .sw .nm { color:var(--mut); }
  .presets { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { padding:6px 12px; border-radius:8px; border:1px solid var(--line);
         background:#141821; color:var(--tx); cursor:pointer; font-size:13px; }
  .btn:hover { border-color:var(--acc); }
  #order { font-size:12.5px; color:var(--mut); white-space:pre-wrap;
           font-family:ui-monospace,Menlo,Consolas,monospace; }
  .hint { color:var(--mut); font-size:12.5px; margin-top:8px; }
  .btn.primary { width:100%; padding:11px 12px; font-size:14.5px;
                 font-weight:600; border-color:var(--acc);
                 background:var(--acc); color:#fff; }
  .btn.primary:hover { filter:brightness(1.08); }
  /* summary step — the order sheet lives here, not under the pickers */
  #summary { position:fixed; inset:0; z-index:50; overflow-y:auto;
             background:var(--bg); padding:24px 16px 40px; }
  #summary .sheet { max-width:620px; margin:0 auto; background:var(--card);
                    border:1px solid var(--line); border-radius:14px;
                    padding:20px; }
  #summary h2 { font-size:18px; margin-bottom:6px; }
  #shot { display:block; width:100%; max-width:340px; height:auto;
          margin:10px auto 14px; }
  #summary .lead { color:var(--mut); font-size:13.5px; margin-bottom:16px; }
  .code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px;
          letter-spacing:.5px; font-weight:600; color:var(--acc);
          background:var(--chipbg,#141821); border:1px dashed var(--acc);
          border-radius:10px; padding:12px; text-align:center;
          margin-bottom:16px; word-break:break-all; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  /* phone: the page doesn't scroll — the glove is fixed in place and only
     the picker column scrolls beneath it */
  @media (max-width: 900px) {
    header { padding:10px 14px; }
    header h1 { font-size:16px; }
    header .sub { display:none; }
    /* nowrap is load-bearing: with the fixed height below, the inherited
       flex-wrap would break the column into a second column off-screen */
    .wrap { flex-direction:column; flex-wrap:nowrap; padding:10px; gap:10px;
            height:calc(100vh - 46px); height:calc(100dvh - 46px);
            overflow:hidden; }
    .stage { flex:none; min-width:0; padding:8px; align-self:stretch; }
    #glove { max-height:38vh; width:auto; max-width:100%; }
    .side { flex:1 1 auto; min-width:0; min-height:0; overflow-y:auto;
            -webkit-overflow-scrolling:touch; padding-bottom:24px; }
  }
</style>
</head>
<body>
<header>
  <h1>SSK Custom Glove Builder</h1>
  <span class="sub">back view demo &middot; click a part on the glove, then pick a color</span>
</header>
<div class="wrap">
  <div class="stage"><canvas id="glove"></canvas></div>
  <div class="side">
    <div class="card">
      <h2>Presets</h2>
      <div class="presets" id="presets"></div>
    </div>
    <div class="card">
      <h2>Part</h2>
      <div class="zones" id="zones"></div>
    </div>
    <div class="card">
      <h2>Color <span id="palname" style="text-transform:none"></span></h2>
      <div class="colors" id="colors"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="card">
      <h2>Bullet logo (wrist)</h2>
      <div class="colors" id="bullets"></div>
    </div>
    <div class="card">
      <button class="btn primary" id="finish">Finish building &rarr;</button>
    </div>
  </div>
</div>

<div id="summary" hidden>
  <div class="sheet">
    <h2>Your SSK custom glove</h2>
    <img id="shot" alt="Your glove">
    <p class="lead">Give this reference to SSK Europe with your order &mdash;
       it contains every choice below.</p>
    <div class="code" id="code"></div>
    <div id="order"></div>
    <div class="acts">
      <button class="btn" id="copy">Copy specification</button>
      <button class="btn" id="back">&larr; Keep building</button>
    </div>
  </div>
</div>

  }
  const zs = document.getElementById('zones');
  for (const z of DATA.zones) {
    const b = document.createElement('div');
    b.className = 'zone';
    b.innerHTML = `<span class="dot"></span>${z.label}`;
    b.onclick = () => pickZone(z.id);
    els[z.id] = b;
    zs.appendChild(b);
  }
  const bl = document.getElementById('bullets');
  DATA.bullets.forEach((b, i) => {
    const d = document.createElement('div');
    const off = b.active === false;
    d.className = 'sw' + (i === bulletSel ? ' sel' : '') + (off ? ' off' : '');
    if (off) d.title = 'Not available yet';
    d.style.flexDirection = 'column';
    d.style.textAlign = 'center';
    d.innerHTML = (b.thumb ? `<img src="${b.thumb}" style="width:100%;border-radius:6px">`
                           : `<span class="chip" style="background:${b.tint};width:100%;height:28px"></span>`) +
                  `<span style="font-size:11px">${b.name}</span>` +
                  (b.art ? `<span class="nm" style="font-size:10px">${b.art}</span>` : '');
    if (!off) d.onclick = () => {
      bulletSel = i;
      for (const c of bl.children) c.classList.remove('sel');
      d.classList.add('sel');
      render();
    };
    bl.appendChild(d);
  });
  applyPreset('Navy & Orange');
  // a link carrying a reference code opens on exactly that design
  if (location.hash.length > 4 && applyCode(location.hash)) {
    render();
    if (selected) pickZone(selected);
    document.getElementById('bullets').querySelectorAll('.sw')
      .forEach((el, i) => el.classList.toggle('sel', i === bulletSel));
  }
  pickZone('web');
});
</script>
</body>
</html>
