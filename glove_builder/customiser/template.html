<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSK Custom Glove Builder</title>
<style>
  :root { --bg:#101216; --card:#1a1e26; --line:#2a3040; --tx:#e8e9ec;
          --mut:#9aa2b1; --acc:#f05a28; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx);
         font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { display:flex; align-items:baseline; gap:14px;
           padding:14px 22px; border-bottom:1px solid var(--line); }
  header h1 { font-size:19px; letter-spacing:.4px; }
  header .sub { color:var(--mut); font-size:13px; }
  .wrap { display:flex; gap:18px; padding:18px 22px; flex-wrap:wrap;
          align-items:flex-start; }
  .stage { flex:1 1 460px; min-width:340px; background:var(--card);
           border:1px solid var(--line); border-radius:12px; padding:14px;
           display:flex; align-items:center; justify-content:center; }
  #glove { max-width:100%; height:auto; cursor:pointer; border-radius:6px;
           max-height:calc(100vh - 130px); }
  .side { flex:1 1 380px; min-width:320px; display:flex;
          flex-direction:column; gap:14px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px;
             color:var(--mut); margin-bottom:10px; }
  .zones { display:flex; flex-wrap:wrap; gap:6px; }
  .zone { padding:5px 10px; border:1px solid var(--line); border-radius:99px;
          background:#141821; font-size:13px; cursor:pointer; display:flex;
          align-items:center; gap:7px; }
  .zone .dot { width:12px; height:12px; border-radius:3px;
               border:1px solid #0008; }
  .zone.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
  .colors { display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr));
            gap:6px; }
  .sw { display:flex; align-items:center; gap:7px; padding:5px 7px;
        border:1px solid var(--line); border-radius:8px; cursor:pointer;
        font-size:12px; background:#141821; }
  .sw:hover { border-color:#4a5468; }
  .sw.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
  .sw .chip { width:20px; height:20px; border-radius:5px; flex:none;
              border:1px solid #0009; }
  .sw.off { opacity:.35; pointer-events:none; }
  .sw .nm { color:var(--mut); }
  .presets { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { padding:6px 12px; border-radius:8px; border:1px solid var(--line);
         background:#141821; color:var(--tx); cursor:pointer; font-size:13px; }
  .btn:hover { border-color:var(--acc); }
  #order { font-size:12.5px; color:var(--mut); white-space:pre-wrap;
           font-family:ui-monospace,Menlo,Consolas,monospace; }
  .hint { color:var(--mut); font-size:12.5px; margin-top:8px; }
  .btn.primary { width:100%; padding:11px 12px; font-size:14.5px;
                 font-weight:600; border-color:var(--acc);
                 background:var(--acc); color:#fff; }
  .btn.primary:hover { filter:brightness(1.08); }
  /* summary step — the order sheet lives here, not under the pickers */
  #summary { position:fixed; inset:0; z-index:50; overflow-y:auto;
             background:var(--bg); padding:24px 16px 40px; }
  #summary .sheet { max-width:620px; margin:0 auto; background:var(--card);
                    border:1px solid var(--line); border-radius:14px;
                    padding:20px; }
  #summary h2 { font-size:18px; margin-bottom:6px; }
  #shot { display:block; width:100%; max-width:340px; height:auto;
          margin:10px auto 14px; }
  #summary .lead { color:var(--mut); font-size:13.5px; margin-bottom:16px; }
  .code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px;
          letter-spacing:.5px; font-weight:600; color:var(--acc);
          background:var(--chipbg,#141821); border:1px dashed var(--acc);
          border-radius:10px; padding:12px; text-align:center;
          margin-bottom:16px; word-break:break-all; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  /* phone: the page doesn't scroll — the glove is fixed in place and only
     the picker column scrolls beneath it */
  @media (max-width: 900px) {
    header { padding:10px 14px; }
    header h1 { font-size:16px; }
    header .sub { display:none; }
    /* nowrap is load-bearing: with the fixed height below, the inherited
       flex-wrap would break the column into a second column off-screen */
    .wrap { flex-direction:column; flex-wrap:nowrap; padding:10px; gap:10px;
            height:calc(100vh - 46px); height:calc(100dvh - 46px);
            overflow:hidden; }
    .stage { flex:none; min-width:0; padding:8px; align-self:stretch; }
    #glove { max-height:38vh; width:auto; max-width:100%; }
    .side { flex:1 1 auto; min-width:0; min-height:0; overflow-y:auto;
            -webkit-overflow-scrolling:touch; padding-bottom:24px; }
  }
</style>
</head>
<body>
<header>
  <h1>SSK Custom Glove Builder</h1>
  <span class="sub">back view demo &middot; click a part on the glove, then pick a color</span>
</header>
<div class="wrap">
  <div class="stage"><canvas id="glove"></canvas></div>
  <div class="side">
    <div class="card">
      <h2>Presets</h2>
      <div class="presets" id="presets"></div>
    </div>
    <div class="card">
      <h2>Part</h2>
      <div class="zones" id="zones"></div>
    </div>
    <div class="card">
      <h2>Color <span id="palname" style="text-transform:none"></span></h2>
      <div class="colors" id="colors"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="card">
      <h2>Bullet logo (wrist)</h2>
      <div class="colors" id="bullets"></div>
    </div>
    <div class="card">
      <button class="btn primary" id="finish">Finish building &rarr;</button>
    </div>
  </div>
</div>

<div id="summary" hidden>
  <div class="sheet">
    <h2>Your SSK custom glove</h2>
    <img id="shot" alt="Your glove">
    <p class="lead">Give this reference to SSK Europe with your order &mdash;
       it contains every choice below.</p>
    <div class="code" id="code"></div>
    <div id="order"></div>
    <div class="acts">
      <button class="btn" id="copy">Copy specification</button>
      <button class="btn" id="back">&larr; Keep building</button>
    </div>
  </div>
</div>
<script>
const DATA = /*__DATA__*/;
const imgs = {}, state = {}, els = {};
let selected = null;

function loadAll() {
  const names = Object.keys(DATA.assets);
  return Promise.all(names.map(n => new Promise(res => {
    const im = new Image();
    im.onload = () => { imgs[n] = im; res(); };
    im.src = DATA.assets[n];
  })));
}
const cv = document.getElementById('glove');
cv.width = DATA.w; cv.height = DATA.h;
const ctx = cv.getContext('2d');
const off = document.createElement('canvas');
off.width = DATA.w; off.height = DATA.h;
const octx = off.getContext('2d');
let idData = null;

function hex(id) {
  const z = DATA.zones.find(z => z.id === id);
  const pal = DATA.palettes[z.group];
  const c = pal.find(c => c[0] === state[id]);
  return c ? c[2] : '#888888';
}
function tinted(id) {
  octx.clearRect(0, 0, off.width, off.height);
  octx.globalCompositeOperation = 'source-over';
  octx.drawImage(imgs[id], 0, 0);
  octx.globalCompositeOperation = 'multiply';
  octx.fillStyle = hex(id);
  octx.fillRect(0, 0, off.width, off.height);
  octx.globalCompositeOperation = 'destination-in';
  octx.drawImage(imgs[id], 0, 0);
  return off;
}
let bulletSel = DATA.bullets.findIndex(b => b.name === 'Black/Gold');
function shade(hx, f) { // f>0 lighten toward white, f<0 darken
  const n = parseInt(hx.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const t = f > 0 ? 255 : 0, k = Math.abs(f);
  r = Math.round(r + (t - r) * k); g = Math.round(g + (t - g) * k);
  b = Math.round(b + (t - b) * k);
  return `rgb(${r},${g},${b})`;
}
function drawBullet() {
  const opt = DATA.bullets[bulletSel];
  if (!imgs.bullet_logo) return;
  if (!opt || opt.tint === null) { ctx.drawImage(imgs.bullet_logo, 0, 0); return; }
  const bb = DATA.bulletBox;
  octx.clearRect(0, 0, off.width, off.height);
  octx.globalCompositeOperation = 'source-over';
  if (opt.asset && imgs[opt.asset]) {
    ctx.drawImage(imgs[opt.asset], 0, 0);
    return;
  }
  if (opt.material === 'rubber' || opt.material === 'plastic') {
    // raised smooth patch: gradient body + specular band, masked by the
    // logo silhouette; a soft dark rim underneath sells the relief
    const g = octx.createLinearGradient(0, bb[1], 0, bb[3]);
    if (opt.material === 'rubber') {
      g.addColorStop(0, shade(opt.tint, 0.62));
      g.addColorStop(0.35, opt.tint);
      g.addColorStop(0.62, shade(opt.tint, -0.28));
      g.addColorStop(0.78, shade(opt.tint, 0.30));
      g.addColorStop(1, shade(opt.tint, -0.45));
    } else {
      g.addColorStop(0, shade(opt.tint, 0.55));
      g.addColorStop(0.5, opt.tint);
      g.addColorStop(1, shade(opt.tint, -0.22));
    }
    octx.fillStyle = g;
    octx.fillRect(bb[0] - 4, bb[1] - 4, bb[2] - bb[0] + 8, bb[3] - bb[1] + 8);
    octx.globalCompositeOperation = 'destination-in';
    octx.drawImage(imgs.bullet_logo_tb, 0, 0);
    // dark rim: silhouette offset behind
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.filter = 'brightness(0)';
    ctx.drawImage(imgs.bullet_logo_tb, 2, 3);
    ctx.filter = 'none';
    ctx.restore();
    ctx.drawImage(off, 0, 0);
    if (opt.material === 'plastic') {
      // glossy streak
      ctx.save();
      ctx.beginPath();
      ctx.rect(bb[0], bb[1], bb[2] - bb[0], (bb[3] - bb[1]) * 0.32);
      ctx.clip();
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = '#ffffff';
      octx.globalCompositeOperation = 'source-over';
      ctx.fillRect(bb[0], bb[1], bb[2] - bb[0], (bb[3] - bb[1]) * 0.32);
      ctx.restore();
    }
    return;
  }
  octx.drawImage(imgs.bullet_logo_tb, 0, 0);
  octx.globalCompositeOperation = 'multiply';
  octx.fillStyle = opt.tint;
  octx.fillRect(0, 0, off.width, off.height);
  octx.globalCompositeOperation = 'destination-in';
  octx.drawImage(imgs.bullet_logo_tb, 0, 0);
  ctx.drawImage(off, 0, 0);
}
function render() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(imgs.glove, 0, 0);
  for (const z of DATA.zones) {
    ctx.drawImage(tinted(z.id), 0, 0);
  }
  drawBullet();
  order();
}
function order() {
  const lines = DATA.zones.map(z => {
    const pal = DATA.palettes[z.group];
    const c = pal.find(c => c[0] === state[z.id]);
    return `${z.label}: ${c ? c[0] + '. ' + c[1] : '-'}`;
  });
  const bo = DATA.bullets[bulletSel];
  if (bo) lines.push(`Bullet logo: ${bo.name}${bo.art ? ' (' + bo.art + ')' : ''}`);
  const code = refCode();
  document.getElementById('order').textContent = lines.join('\n');
  document.getElementById('code').textContent = code;
  // the design lives in the URL, so a refresh or a forwarded link keeps it
  history.replaceState(null, '', '#' + code);
  for (const z of DATA.zones) {
    els[z.id].querySelector('.dot').style.background = hex(z.id);
  }
}
/* Packs every choice into one short reference: 5 bits per zone (its index in
   that zone's palette) plus 4 bits for the bullet logo, base36. SSK can read
   the exact build back out of it, so the code alone identifies the glove. */
function refCode() {
  let bits = 0n;
  for (const z of DATA.zones) {
    const pal = DATA.palettes[z.group];
    const i = Math.max(0, pal.findIndex(c => c[0] === state[z.id]));
    bits = (bits << 5n) | BigInt(i & 31);
  }
  bits = (bits << 4n) | BigInt(bulletSel & 15);
  let s = bits.toString(36).toUpperCase().padStart(20, '0');
  return 'SSK-' + s.match(/.{4}/g).join('-');
}
/* ...and back again, so the code doubles as a shareable link. */
function applyCode(code) {
  const s = String(code).toUpperCase().replace(/^#?SSK-?/, '').replace(/-/g, '');
  if (!/^[0-9A-Z]{1,20}$/.test(s)) return false;
  let bits = 0n;
  for (const ch of s) bits = bits * 36n + BigInt(parseInt(ch, 36));
  const bullet = Number(bits & 15n);
  bits >>= 4n;
  for (const z of [...DATA.zones].reverse()) {
    const pal = DATA.palettes[z.group];
    const c = pal[Number(bits & 31n)];
    bits >>= 5n;
    if (c) state[z.id] = c[0];
  }
  if (DATA.bullets[bullet]) bulletSel = bullet;
  return true;
}
function pickZone(id) {
  selected = id;
  for (const z of DATA.zones) els[z.id].classList.toggle('sel', z.id === id);
  const z = DATA.zones.find(z => z.id === id);
  document.getElementById('palname').textContent = '- ' + z.label;
  const grid = document.getElementById('colors');
  grid.innerHTML = '';
  for (const [num, name, hx] of DATA.palettes[z.group]) {
    const b = document.createElement('div');
    b.className = 'sw' + (state[id] === num ? ' sel' : '');
    b.innerHTML = `<span class="chip" style="background:${hx}"></span>` +
                  `<span>${num}.</span><span class="nm">${name}</span>`;
    b.onclick = () => { state[id] = num; render(); pickZone(id); };
    grid.appendChild(b);
  }
  document.getElementById('hint').textContent =
    z.group === 'lace' ? 'Lace palette: leather colors + Gold Foil.' :
    z.group === 'stitching' ? 'Stitching thread palette (14 colors).' :
    z.group === 'embroidery' ? 'Embroidery palette (incl. Gold / Silver).' :
    'SSK leather palette (28 colors).';
}
function applyPreset(p) {
  const pr = DATA.presets[p];
  for (const z of DATA.zones) {
    const v = pr[z.id] !== undefined ? pr[z.id] : pr['_panels'];
    const pal = DATA.palettes[z.group];
    state[z.id] = pal.some(c => c[0] === v) ? v : pal[0][0];
  }
  render();
  if (selected) pickZone(selected);
}
cv.addEventListener('click', ev => {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((ev.clientX - r.left) * cv.width / r.width);
  const y = Math.floor((ev.clientY - r.top) * cv.height / r.height);
  const n = idData[(y * cv.width + x) * 4];
  const z = DATA.zones.find(z => z.n === n);
  if (z) pickZone(z.id);
});
const summaryEl = document.getElementById('summary');
document.getElementById('finish').onclick = () => {
  order();
  document.getElementById('shot').src = cv.toDataURL('image/png');
  summaryEl.hidden = false;
  summaryEl.scrollTop = 0;
};
document.getElementById('back').onclick = () => { summaryEl.hidden = true; };
document.getElementById('copy').onclick = async ev => {
  const txt = 'SSK custom glove\nReference: ' + refCode() + '\n\n' +
              document.getElementById('order').textContent;
  try {
    await navigator.clipboard.writeText(txt);
  } catch (e) {                       // file:// and older Safari have no API
    const t = document.createElement('textarea');
    t.value = txt; document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove();
  }
  const b = ev.currentTarget, old = b.textContent;
  b.textContent = 'Copied';
  setTimeout(() => { b.textContent = old; }, 1600);
};
loadAll().then(() => {
  const ic = document.createElement('canvas');
  ic.width = DATA.w; ic.height = DATA.h;
  const ictx = ic.getContext('2d');
  ictx.drawImage(imgs._idmap, 0, 0);
  idData = ictx.getImageData(0, 0, DATA.w, DATA.h).data;
  const ps = document.getElementById('presets');
  for (const p of Object.keys(DATA.presets)) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = p;
    b.onclick = () => applyPreset(p);
    ps.appendChild(b);
  }
  const zs = document.getElementById('zones');
  for (const z of DATA.zones) {
    const b = document.createElement('div');
    b.className = 'zone';
    b.innerHTML = `<span class="dot"></span>${z.label}`;
    b.onclick = () => pickZone(z.id);
    els[z.id] = b;
    zs.appendChild(b);
  }
  const bl = document.getElementById('bullets');
  DATA.bullets.forEach((b, i) => {
    const d = document.createElement('div');
    const off = b.active === false;
    d.className = 'sw' + (i === bulletSel ? ' sel' : '') + (off ? ' off' : '');
    if (off) d.title = 'Not available yet';
    d.style.flexDirection = 'column';
    d.style.textAlign = 'center';
    d.innerHTML = (b.thumb ? `<img src="${b.thumb}" style="width:100%;border-radius:6px">`
                           : `<span class="chip" style="background:${b.tint};width:100%;height:28px"></span>`) +
                  `<span style="font-size:11px">${b.name}</span>` +
                  (b.art ? `<span class="nm" style="font-size:10px">${b.art}</span>` : '');
    if (!off) d.onclick = () => {
      bulletSel = i;
      for (const c of bl.children) c.classList.remove('sel');
      d.classList.add('sel');
      render();
    };
    bl.appendChild(d);
  });
  applyPreset('Navy & Orange');
  // a link carrying a reference code opens on exactly that design
  if (location.hash.length > 4 && applyCode(location.hash)) {
    render();
    if (selected) pickZone(selected);
    document.getElementById('bullets').querySelectorAll('.sw')
      .forEach((el, i) => el.classList.toggle('sel', i === bulletSel));
  }
  pickZone('web');
});
</script>
</body>
</html>
