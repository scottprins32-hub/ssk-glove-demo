<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSK side views (preview)</title>
<style>
  :root { --bg: #f4f3ef; --ink: #1d1d1b; --muted: #6b6a66; --line: #d9d7d0;
          --warn-bg: #fff4d6; --warn-line: #e3c36a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); }
  header { padding: 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  canvas { max-width: 100%; height: auto; max-height: 78vh; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: #fff;
           border-radius: 6px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  label { display: grid; grid-template-columns: 1fr 150px; gap: 8px; align-items: center;
          margin: 4px 0; }
  select { font: inherit; padding: 4px; width: 100%; }
  .note { font-size: 13px; color: var(--muted); margin: 8px 0; }
  .warn { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 6px;
          padding: 8px 10px; font-size: 14px; max-width: 560px; }
  .warn[hidden] { display: none; }
  h2 { font-size: 15px; margin: 14px 0 6px; }
</style>
</head>
<body>
<header>
  <h1>Duim- en pinkzijde, vaste SSK-basishandschoen</h1>
  <p>Proefpagina buiten de configurator. Bron: winkelshoot 23 sept., DSC05708 (duim) en DSC05710 (pink).</p>
</header>
<main>
  <section class="stage">
    <canvas id="glove" aria-label="Glove side view"></canvas>
    <div id="webWarn" class="warn" hidden></div>
    <div id="fixedNote" class="note"></div>
  </section>
  <aside>
    <div class="row" id="views"></div>
    <div class="row" id="hands"></div>
    <div class="row"><button id="fromApp" type="button">Neem kleuren over uit configurator</button></div>
    <label>Web <select id="web"></select></label>
    <h2>Kleuren in dit aanzicht</h2>
    <div id="fields"></div>
    <p class="note" id="hidden"></p>
  </aside>
</main>
<script type="module" src="side-views.js"></script>
</body>
</html>
